
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b2942">
  <title>Offline | FINEDUCATION</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b2942;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { padding: 28px; }
    .icon { font-size: 58px; }
    h1 { color: #f4c542; }
    p { line-height: 1.7; }
    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 8px;
      background: #f4c542;
      color: #0b2942;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon">📶</div>
    <h1>You are offline</h1>
    <p>Internet connection is unavailable.<br>
    Please reconnect and try again.</p>
    <button onclick="location.reload()">Try Again</button>
    <p>FINEDUCATION INSTITUTE</p>
  </main>
</body>
</html>
